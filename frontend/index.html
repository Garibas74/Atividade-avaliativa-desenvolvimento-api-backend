<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi API TodoList</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="container">
    <h1>Multi API TodoList</h1>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="auth" class="card">
        <h2 id="authTitle">Entrar</h2>
        <form id="authForm">
            <label id="nameLabel" hidden>Nome<input id="name" minlength="2" maxlength="100" autocomplete="name"></label>
            <label>Email<input id="email" type="email" required maxlength="254" autocomplete="username"></label>
            <label>Senha<input id="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password"></label>
            <p class="hint">Use uma senha com pelo menos 8 caracteres.</p>
            <button type="submit" id="authSubmit">Entrar</button>
            <button type="button" id="authToggle">Criar uma conta</button>
        </form>
    </section>
    <div id="workspace" hidden>
        <div class="session"><span id="userName"></span><button id="logout" type="button">Sair</button></div>
        <section class="card">
            <h2>Nova tarefa</h2>
            <form id="todoForm">
                <label>Título<input id="title" placeholder="O que você precisa fazer?" required maxlength="200"></label>
                <label>Descrição<textarea id="description" maxlength="2000" placeholder="Opcional"></textarea></label>
                <button type="submit">Adicionar</button>
            </form>
        </section>
        <section class="card"><h2>Minhas tarefas</h2><ul id="todoList"></ul></section>
        <section class="card">
            <h2>Estatísticas</h2>
            <p>Total: <span id="total">0</span></p>
            <p>Concluídas: <span id="completed">0</span></p>
            <p>Pendentes: <span id="pending">0</span></p>
        </section>
    </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
